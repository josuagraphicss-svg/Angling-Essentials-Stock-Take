<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angling Essentials Stock Take</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f7;
color:#17202a;
}

.app{
max-width:600px;
margin:auto;
padding:20px;
}

.header{
background:#111827;
color:white;
padding:24px;
border-radius:18px;
margin-bottom:20px;
}

.header h1{
margin:0;
font-size:26px;
}

.header p{
margin:6px 0 0;
opacity:.75;
}

.scan-button{
width:100%;
min-height:150px;
border:0;
border-radius:20px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,.08);
font-size:22px;
font-weight:bold;
}

.scan-icon{
font-size:55px;
display:block;
margin-bottom:10px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:16px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-icon{
font-size:30px;
}

.card strong{
display:block;
margin-top:8px;
font-size:17px;
}

.summary{
margin-top:14px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.summary h2{
margin-top:0;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>Angling Essentials</h1>
<p>Stock Take System</p>
</div>

<button class="scan-button" onclick="startScan()">
<span class="scan-icon">📷</span>
SCAN ITEM
</button>

<div class="cards">

<div class="card">
<div class="card-icon">📦</div>
<strong>Stock Take</strong>
<span>0 items</span>
</div>

<div class="card">
<div class="card-icon">⚠️</div>
<strong>Variances</strong>
<span>0 items</span>
</div>

</div>

<div class="summary">
<h2>📊 Stock Take Summary</h2>
<p>Items scanned: <strong>0</strong></p>
<p>Items matching: <strong>0</strong></p>
<p>Items with differences: <strong>0</strong></p>
</div>

</div>

<script>
function startScan(){
alert("Barcode scanner coming in Step 3.");
}
</script>

</body>
</html>
