<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angling Essentials Stock Take</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#17202a;
}

.app{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  background:#111827;
  color:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:16px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:6px 0 0;
  opacity:.75;
}

.scan-button{
  width:100%;
  min-height:150px;
  border:0;
  border-radius:20px;
  background:white;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

.scan-icon{
  font-size:55px;
  display:block;
  margin-bottom:10px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card-icon{
  font-size:30px;
}

.card strong{
  display:block;
  margin-top:7px;
  font-size:16px;
}

.summary{
  margin-top:14px;
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.summary h2{
  margin-top:0;
  font-size:20px;
}

.scanner{
  display:none;
  margin-top:16px;
  background:#111827;
  padding:14px;
  border-radius:20px;
  color:white;
}

#camera{
  width:100%;
  border-radius:14px;
  background:#000;
}

.scanner-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.close-button{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

.manual{
  margin-top:14px;
  background:white;
  padding:18px;
  border-radius:16px;
}

.manual h3{
  margin-top:0;
}

.manual input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
  margin-bottom:10px;
}

.manual button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#eef2f7;
  font-size:14px;
}

@media(max-width:400px){
  .app{padding:12px}
  .header h1{font-size:22px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🎣 Angling Essentials</h1>
    <p>Stock Take System</p>
  </div>

  <button class="scan-button" id="scanButton" type="button">
    <span class="scan-icon">📷</span>
    SCAN ITEM
    <small style="display:block;margin-top:8px;font-size:13px;font-weight:normal;color:#667085">
      Scan a product barcode
    </small>
  </button>

  <div class="scanner" id="scanner">

    <div class="scanner-title">
      📷 Scan Barcode
    </div>

    <video id="camera" autoplay playsinline></video>

    <div class="status" id="scanStatus">
      Point your camera at a product barcode.
    </div>

    <button class="close-button" id="closeScanner" type="button">
      ✕ Close Scanner
    </button>

  </div>

  <div class="manual">

    <h3>⌨️ Manual Barcode</h3>

    <input
      id="barcodeInput"
      type="text"
      inputmode="numeric"
      placeholder="Enter barcode manually"
    >

    <button id="manualButton" type="button">
      FIND PRODUCT
    </button>

    <div class="status" id="result">
      No product scanned yet.
    </div>

  </div>

  <div class="cards">

    <div class="card">
      <div class="card-icon">📦</div>
      <strong>Stock Take</strong>
      <span id="itemCount">0 items</span>
    </div>

    <div class="card">
      <div class="card-icon">⚠️</div>
      <strong>Variances</strong>
      <span id="varianceCount">0 items</span>
    </div>

  </div>

  <div class="summary">

    <h2>📊 Stock Take Summary</h2>

    <p>
      Items scanned:
      <strong id="scannedCount">0</strong>
    </p>

    <p>
      Items matching:
      <strong id="matchingCount">0</strong>
    </p>

    <p>
      Items with differences:
      <strong id="differenceCount">0</strong>
    </p>

  </div>

</div>

<script>

let stream = null;
let scanning = false;
let scannedItems = [];

const scanButton = document.getElementById("scanButton");
const scanner = document.getElementById("scanner");
const camera = document.getElementById("camera");
const closeScanner = document.getElementById("closeScanner");
const scanStatus = document.getElementById("scanStatus");

const barcodeInput = document.getElementById("barcodeInput");
const manualButton = document.getElementById("manualButton");
const result = document.getElementById("result");

const itemCount = document.getElementById("itemCount");
const varianceCount = document.getElementById("varianceCount");
const scannedCount = document.getElementById("scannedCount");

async function startScanner(){

  scanner.style.display = "block";
  scanStatus.textContent = "Starting camera...";

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanStatus.textContent =
      "Camera scanning is not supported here. Use Manual Barcode below.";
    return;
  }

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{
          ideal:"environment"
        }
      },
      audio:false
    });

    camera.srcObject = stream;

    scanStatus.textContent =
      "Point the camera at the barcode.";

    scanning = true;

    if("BarcodeDetector" in window){

      const detector = new BarcodeDetector({
        formats:[
          "ean_13",
          "ean_8",
          "upc_a",
          "upc_e",
          "code_128",
          "code_39"
        ]
      });

      scanLoop(detector);

    }else{

      scanStatus.textContent =
        "Camera opened. Automatic barcode detection is not supported by this browser. Use Manual Barcode below.";

    }

  }catch(error){

    scanStatus.textContent =
      "Camera permission was not available. Please allow camera access or use Manual Barcode.";

  }

}

async function scanLoop(detector){

  if(!scanning) return;

  try{

    const barcodes = await detector.detect(camera);

    if(barcodes.length > 0){

      const code = barcodes[0].rawValue;

      if(code){

        scanning = false;

        barcodeInput.value = code;

        handleBarcode(code);

        stopScanner();

        return;
      }
    }

  }catch(error){

    console.log(error);

  }

  requestAnimationFrame(() => scanLoop(detector));

}

function stopScanner(){

  scanning = false;

  if(stream){

    stream.getTracks().forEach(track => track.stop());

    stream = null;

  }

  camera.srcObject = null;
}

function handleBarcode(code){

  code = String(code).trim();

  if(!code){

    result.textContent = "Please enter a barcode.";
    return;
  }

  result.innerHTML =
    "<strong>Barcode scanned:</strong><br>" +
    code +
    "<br><br>" +
    "Product lookup will be connected to the Angling Essentials website in the next step.";

  scannedItems.push(code);

  updateSummary();

}

function updateSummary(){

  const total = scannedItems.length;

  itemCount.textContent =
    total + (total === 1 ? " item" : " items");

  scannedCount.textContent = total;

}

scanButton.addEventListener("click", startScanner);

closeScanner.addEventListener("click", () => {

  stopScanner();

  scanner.style.display = "none";

});

manualButton.addEventListener("click", () => {

  handleBarcode(barcodeInput.value);

});

barcodeInput.addEventListener("keydown", event => {

  if(event.key === "Enter"){

    handleBarcode(barcodeInput.value);

  }

});

</script>

</body>
</html>
