<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angling Essentials Stock Take</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f3f7;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 18px;
}

.header {
  background: #111827;
  color: white;
  border-radius: 28px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  margin: 8px 0 0;
  color: #cbd5e1;
  font-size: 20px;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.scan-button {
  width: 100%;
  border: 0;
  border-radius: 25px;
  background: #111827;
  color: white;
  padding: 25px 15px;
  font-size: 27px;
  font-weight: bold;
  cursor: pointer;
}

.scan-button:active {
  transform: scale(0.98);
}

.camera-icon {
  font-size: 55px;
  display: block;
  margin-bottom: 8px;
}

.section-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 18px;
  border: 2px solid #d1d5db;
  border-radius: 18px;
  font-size: 20px;
  margin-bottom: 12px;
}

button {
  cursor: pointer;
}

.find-button,
.save-button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 18px;
  background: #111827;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.scanner-box {
  display: none;
  background: #000;
  border-radius: 22px;
  overflow: hidden;
  margin-top: 18px;
  position: relative;
}

#scannerVideo {
  width: 100%;
  display: block;
  min-height: 280px;
  object-fit: cover;
}

.stop-button {
  position: absolute;
  bottom: 15px;
  left: 15px;
  right: 15px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: white;
  color: #111827;
  font-weight: bold;
  font-size: 18px;
}

.status {
  background: #eef2f7;
  border-radius: 18px;
  padding: 16px;
  margin-top: 15px;
  font-size: 18px;
}

.product {
  display: none;
}

.product-name {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.barcode {
  color: #64748b;
  margin-bottom: 20px;
  font-size: 17px;
}

.stock-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.stock-item {
  background: #f1f5f9;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
}

.stock-label {
  font-size: 15px;
  color: #64748b;
  margin-bottom: 8px;
}

.stock-number {
  font-size: 32px;
  font-weight: bold;
}

.variance {
  padding: 16px;
  border-radius: 18px;
  background: #f1f5f9;
  margin-bottom: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.summary-box {
  background: #f1f5f9;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
}

.summary-number {
  font-size: 32px;
  font-weight: bold;
}

.summary-label {
  color: #64748b;
  margin-top: 5px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.warning {
  background: #fef3c7;
  color: #92400e;
}

.history {
  margin-top: 15px;
}

.history-item {
  background: #f8fafc;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}

.history-name {
  font-weight: bold;
}

.history-details {
  color: #64748b;
  margin-top: 5px;
}

.small-button {
  margin-top: 10px;
  border: 0;
  padding: 10px 14px;
  border-radius: 10px;
  background: #e2e8f0;
  font-weight: bold;
}

@media (max-width: 600px) {
  .container {
    padding: 12px;
  }

  .header h1 {
    font-size: 27px;
  }

  .header p {
    font-size: 18px;
  }

  .stock-box,
  .summary-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎣 Angling Essentials</h1>
    <p>Stock Take System — Version 4</p>
  </div>

  <div class="card">
    <button class="scan-button" onclick="startScanner()">
      <span class="camera-icon">📷</span>
      SCAN ITEM
      <div style="font-size:17px;font-weight:normal;margin-top:8px;">
        Scan a product barcode
      </div>
    </button>

    <div class="scanner-box" id="scannerBox">
      <video id="scannerVideo" autoplay muted playsinline></video>
      <button class="stop-button" onclick="stopScanner()">STOP SCANNER</button>
    </div>

    <div id="scannerStatus" class="status" style="display:none;"></div>
  </div>

  <div class="card">

    <div class="section-title">⌨️ Manual Barcode</div>

    <input
      id="manualBarcode"
      type="text"
      placeholder="Enter barcode manually"
      autocomplete="off"
    >

    <button class="find-button" onclick="manualLookup()">
      FIND PRODUCT
    </button>

    <div id="lookupStatus" class="status">
      No product scanned yet.
    </div>

  </div>

  <div class="card product" id="productCard">

    <div class="section-title">📦 Product</div>

    <div class="product-name" id="productName">
      -
    </div>

    <div class="barcode">
      Barcode: <strong id="productBarcode">-</strong>
    </div>

    <div class="stock-box">

      <div class="stock-item">
        <div class="stock-label">WEBSITE STOCK</div>
        <div class="stock-number" id="websiteStock">-</div>
      </div>

      <div class="stock-item">
        <div class="stock-label">PHYSICAL COUNT</div>
        <div class="stock-number" id="physicalDisplay">-</div>
      </div>

    </div>

    <div class="section-title" style="font-size:20px;">
      Physical Count
    </div>

    <input
      id="physicalCount"
      type="number"
      min="0"
      placeholder="Enter physical quantity"
    >

    <div class="variance" id="varianceBox">
      Variance: -
    </div>

    <button class="save-button" onclick="saveStockCount()">
      💾 SAVE STOCK COUNT
    </button>

  </div>

  <div class="card">

    <div class="section-title">📦 Stock Take</div>

    <div class="summary-grid">

      <div class="summary-box">
        <div class="summary-number" id="totalItems">0</div>
        <div class="summary-label">Items Counted</div>
      </div>

      <div class="summary-box">
        <div class="summary-number" id="totalVariances">0</div>
        <div class="summary-label">Variances</div>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="section-title">📊 Stock Take Summary</div>

    <div id="history">
      No items counted yet.
    </div>

  </div>

</div>

<script>

const API_URL =
  "https://angling-essentials-stock-api.josua-graphicss.workers.dev/";

let reader = null;
let currentControls = null;
let currentBarcode = "";
let currentProduct = null;

let scannedItems = [];

function showStatus(message, type = "") {
  const box = document.getElementById("lookupStatus");

  box.className = "status " + type;
  box.innerHTML = message;
}

function showScannerStatus(message, type = "") {
  const box = document.getElementById("scannerStatus");

  box.style.display = "block";
  box.className = "status " + type;
  box.innerHTML = message;
}

async function startScanner() {

  try {

    document.getElementById("scannerBox").style.display = "block";

    showScannerStatus(
      "📷 Starting camera...",
      ""
    );

    if (!window.ZXingBrowser) {
      throw new Error("Scanner library failed to load.");
    }

    reader = new ZXingBrowser.BrowserMultiFormatReader();

    const videoInputDevices =
      await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

    if (!videoInputDevices.length) {
      throw new Error("No camera found.");
    }

    let selectedDevice = videoInputDevices[0];

    for (const device of videoInputDevices) {

      const label =
        (device.label || "").toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {
        selectedDevice = device;
        break;
      }

    }

    showScannerStatus(
      "📷 Point the camera at the barcode...",
      ""
    );

    currentControls =
      await reader.decodeFromVideoDevice(
        selectedDevice.deviceId,
        "scannerVideo",
        async (result, error) => {

          if (result) {

            const code =
              result.getText().trim();

            if (code) {

              stopScanner();

              await handleBarcode(code);
            }

          }

        }
      );

  } catch (error) {

    console.error(error);

    showScannerStatus(
      "❌ Camera error: " + error.message,
      "error"
    );
  }
}

function stopScanner() {

  try {

    if (currentControls) {
      currentControls.stop();
      currentControls = null;
    }

  } catch (e) {
    console.log(e);
  }

  if (reader) {

    try {
      reader.reset();
    } catch (e) {
      console.log(e);
    }
  }

  document.getElementById("scannerBox").style.display = "none";
}

async function handleBarcode(code) {

  currentBarcode = code;

  showStatus(
    "🔎 Barcode detected: <strong>" +
    escapeHtml(code) +
    "</strong><br><br>Looking up product...",
    ""
  );

  await lookupProduct(code);
}

function manualLookup() {

  const input =
    document.getElementById("manualBarcode");

  const code =
    input.value.trim();

  if (!code) {

    showStatus(
      "Please enter a barcode.",
      "warning"
    );

    return;
  }

  handleBarcode(code);
}

async function lookupProduct(code) {

  currentProduct = null;

  document.getElementById("productCard").style.display = "none";

  try {

    const response =
      await fetch(
        API_URL +
        "?barcode=" +
        encodeURIComponent(code)
      );

    if (!response.ok) {

      throw new Error(
        "Server returned " + response.status
      );
    }

    const data =
      await response.json();

    console.log("Product response:", data);

    if (!data.found) {

      showStatus(
        "❌ Product not found.<br><br>" +
        "Barcode: <strong>" +
        escapeHtml(code) +
        "</strong>",
        "error"
      );

      return;
    }

    currentProduct = data;

    document.getElementById("productCard").style.display =
      "block";

    document.getElementById("productName").textContent =
      data.name || "Unnamed Product";

    document.getElementById("productBarcode").textContent =
      data.barcode || code;

    let stock = data.stock_quantity;

    if (stock === null || stock === undefined) {
      stock = 0;
    }

    document.getElementById("websiteStock").textContent =
      stock;

    document.getElementById("physicalDisplay").textContent =
      "-";

    document.getElementById("physicalCount").value =
      "";

    document.getElementById("varianceBox").textContent =
      "Variance: -";

    showStatus(
      "✅ Product found!<br><br>" +
      "<strong>" +
      escapeHtml(data.name) +
      "</strong><br>" +
      "Website stock: <strong>" +
      stock +
      "</strong>",
      "success"
    );

    document.getElementById("physicalCount").focus();

  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Could not connect to the stock system.<br><br>" +
      error.message,
      "error"
    );
  }
}

document
  .getElementById("physicalCount")
  .addEventListener("input", function() {

    updateVariance();

  });

function updateVariance() {

  if (!currentProduct) {
    return;
  }

  const physical =
    document.getElementById("physicalCount").value;

  if (physical === "") {

    document.getElementById("physicalDisplay").textContent =
      "-";

    document.getElementById("varianceBox").textContent =
      "Variance: -";

    return;
  }

  const physicalNumber =
    Number(physical);

  const website =
    Number(currentProduct.stock_quantity || 0);

  const variance =
    physicalNumber - website;

  document.getElementById("physicalDisplay").textContent =
    physicalNumber;

  let text =
    "Variance: " +
    (variance > 0 ? "+" : "") +
    variance;

  document.getElementById("varianceBox").textContent =
    text;
}

function saveStockCount() {

  if (!currentProduct) {

    showStatus(
      "No product selected.",
      "warning"
    );

    return;
  }

  const physicalInput =
    document.getElementById("physicalCount");

  if (physicalInput.value === "") {

    showStatus(
      "Please enter the physical count.",
      "warning"
    );

    physicalInput.focus();

    return;
  }

  const physical =
    Number(physicalInput.value);

  const website =
    Number(currentProduct.stock_quantity || 0);

  const variance =
    physical - website;

  const item = {

    id: currentProduct.id,

    name: currentProduct.name,

    barcode: currentProduct.barcode || currentBarcode,

    sku: currentProduct.sku,

    websiteStock: website,

    physicalStock: physical,

    variance: variance,

    time: new Date().toLocaleString()

  };

  const existingIndex =
    scannedItems.findIndex(
      item =>
        item.barcode ===
        item.barcode
    );

  scannedItems.push(item);

  updateSummary();

  showStatus(
    "✅ Stock count saved!<br><br>" +
    "<strong>" +
    escapeHtml(currentProduct.name) +
    "</strong><br>" +
    "Website: " +
    website +
    "<br>" +
    "Physical: " +
    physical +
    "<br>" +
    "Variance: " +
    (variance > 0 ? "+" : "") +
    variance,
    "success"
  );

  renderHistory();
}

function updateSummary() {

  document.getElementById("totalItems").textContent =
    scannedItems.length;

  const varianceCount =
    scannedItems.filter(
      item => item.variance !== 0
    ).length;

  document.getElementById("totalVariances").textContent =
    varianceCount;
}

function renderHistory() {

  const box =
    document.getElementById("history");

  if (!scannedItems.length) {

    box.innerHTML =
      "No items counted yet.";

    return;
  }

  let html = "";

  scannedItems.forEach((item, index) => {

    const varianceText =
      item.variance > 0
        ? "+" + item.variance
        : item.variance;

    html +=
      '<div class="history-item">' +

      '<div class="history-name">' +
      escapeHtml(item.name) +
      '</div>' +

      '<div class="history-details">' +
      'Barcode: ' +
      escapeHtml(item.barcode) +
      '<br>' +
      'Website: ' +
      item.websiteStock +
      ' | Physical: ' +
      item.physicalStock +
      '<br>' +
      'Variance: ' +
      varianceText +
      '</div>' +

      '</div>';

  });

  box.innerHTML = html;
}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
